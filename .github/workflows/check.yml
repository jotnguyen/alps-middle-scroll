---
name: check
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene (no personal data or secrets)
        run: bash scripts/hygiene.sh
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { $bad++; $e | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Scripts are ASCII only
        shell: powershell
        run: |
          $hits = Get-ChildItem scripts\*.ps1 | Select-String -Pattern '[^\x00-\x7F]'
          if ($hits) { $hits; exit 1 }
